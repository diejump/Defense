[project]
name = "abp-gnn-study"
version = "0.1.0"
requires-python = ">=3.10,<3.12"
dependencies = [
  "numpy==1.26.4", "scipy==1.14.1", "scikit-learn==1.5.2",
  "networkx==3.3", "matplotlib==3.9.2", "seaborn==0.13.2",
  "tqdm==4.66.5", "psutil==6.0.0", "ogb==1.3.6",
  "torch-geometric==2.5.3", "umap-learn==0.5.5",
  "scikit-learn-extra==0.3.0", "deeprobust==0.2.11", "torchvision==0.15.1",
]

[project.optional-dependencies]
cpu = ["torch==2.0.0+cpu", "torch-scatter==2.1.2+pt20cpu", "torch-sparse==0.6.18+pt20cpu"]
cu118 = ["torch==2.0.0+cu118", "torch-scatter==2.1.2+pt20cu118", "torch-sparse==0.6.18+pt20cu118"]

[tool.uv]
package = false
conflicts = [[{ extra = "cpu" }, { extra = "cu118" }]]
find-links = ["https://data.pyg.org/whl/torch-2.0.0+cpu.html", "https://data.pyg.org/whl/torch-2.0.0+cu118.html"]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'", "sys_platform == 'win32' and platform_machine == 'AMD64'"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", extra = "cpu" }, { index = "pytorch-cu118", extra = "cu118" }]


[[tool.uv.index]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple/"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

